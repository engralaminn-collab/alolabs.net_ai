# ============================================================
# ALO Labs AISMH — Caddy Reverse Proxy Configuration
# Install: copy to /etc/caddy/sites-available/alolabs-aismh
# Enable:  ln -s /etc/caddy/sites-available/alolabs-aismh /etc/caddy/sites-enabled/
# Requires: replace YOUR_DOMAIN with actual domain
# ============================================================

YOUR_DOMAIN {
	# Security headers
	header {
		X-Frame-Options "DENY"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		X-XSS-Protection "1; mode=block"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}

	# Transform port query for internal micro-services
	@transform_port_query {
		query XTransformPort=*
	}
	handle @transform_port_query {
		reverse_proxy localhost:{query.XTransformPort} {
			header_up Host {host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
			header_up X-Real-IP {remote_host}
		transport http {
			read_timeout 300s
			write_timeout 300s
		}
		}
	}

	# Main application
	handle {
		reverse_proxy localhost:3000 {
			header_up Host {host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
			header_up X-Real-IP {remote_host}
		transport http {
			read_timeout 300s
			write_timeout 300s
		}
		}
	}

	# Structured access logs
	log {
		output file /var/log/caddy/alolabs-aismh-access.log {
			roll_size 100mb
			roll_keep 10
			roll_keep_for 30d
		}
		format json {
			level INFO
		}
	}

	# Rate limiting
	request_body {
		max_size 50MB
	}
}
