# ============================================================
# ALO Labs AI-EOS — Docker Compose (Production)
# Services: App, Caddy (auto-SSL), Prometheus, Grafana
# Usage: docker compose up -d
# ============================================================

services:
  # ── Next.js Application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alolabs-ai-eos
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./db/custom.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app_data:/app/db
      - app_storage:/app/storage
      - app_logs:/app/logs
      - app_backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - alolabs-net
    depends_on:
      prometheus:
        condition: service_healthy

  # ── Caddy Reverse Proxy (Auto-SSL) ──────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: alolabs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - alolabs-net
    depends_on:
      app:
        condition: service_healthy

  # ── Prometheus (Metrics Collection) ─────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: alolabs-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - alolabs-net

  # ── Grafana (Monitoring Dashboard) ──────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: alolabs-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - alolabs-net
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  app_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local
  app_backups:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  alolabs-net:
    driver: bridge
