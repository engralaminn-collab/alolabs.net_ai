<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ALO Labs AgentOS circular badge">
  <title>ALO Labs AgentOS circular badge</title>
  <defs>
    <linearGradient id="badgeLegL" x1="0.1" y1="0.1" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0077FF"/><stop offset="1" stop-color="#0047A1"/>
    </linearGradient>
    <linearGradient id="badgeLegR" x1="0.9" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#003ABC"/><stop offset="1" stop-color="#001C6B"/>
    </linearGradient>
    <linearGradient id="badgeFold" x1="0" y1="1" x2="1" y2="0.1">
      <stop offset="0" stop-color="#0053C8"/><stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="badgeBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A2B"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="badgeWord" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#003ABC"/><stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <clipPath id="badgeClip"><circle cx="256" cy="256" r="252"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="252" fill="#FFFFFF"/>

  <!-- circuit traces -->
  <g clip-path="url(#badgeClip)" stroke="#E4EAF3" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M-10 150 H70 l26 26 H150"/>
    <path d="M-10 210 H44 l30 30 H118"/>
    <path d="M-10 268 H60 l24-24 H132"/>
    <path d="M-10 330 H74 l28 28 H146"/>
    <path d="M522 140 H452 l-26 26 H372"/>
    <path d="M522 200 H470 l-30 30 H398"/>
    <path d="M522 262 H462 l-24-24 H392"/>
    <path d="M522 326 H446 l-28 28 H368"/>
  </g>
  <g clip-path="url(#badgeClip)" fill="#E4EAF3">
    <circle cx="152" cy="176" r="6"/><circle cx="120" cy="240" r="6"/><circle cx="134" cy="244" r="6"/>
    <circle cx="148" cy="358" r="6"/><circle cx="370" cy="166" r="6"/><circle cx="396" cy="230" r="6"/>
    <circle cx="390" cy="238" r="6"/><circle cx="366" cy="354" r="6"/>
  </g>

  <!-- rim arcs -->
  <g clip-path="url(#badgeClip)" fill="none" stroke-linecap="round">
    <path d="M64 120 A252 252 0 0 1 196 32" stroke="#FF6A00" stroke-width="7"/>
    <path d="M470 84 A252 252 0 0 1 502 210" stroke="#0077FF" stroke-width="6"/>
  </g>

  <!-- bottom swoosh: orange over blue -->
  <g clip-path="url(#badgeClip)">
    <path d="M120 470 A252 252 0 0 0 392 470 A300 300 0 0 1 120 470 Z" fill="#FF6A00"/>
    <path d="M96 452 A252 252 0 0 0 416 452 A330 330 0 0 1 96 452 Z" fill="#003ABC" opacity="0.92"/>
  </g>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#E4EAF3" stroke-width="2"/>

  <!-- mark -->
  <g transform="translate(0 -14)">
    <path d="M256 62 L334 106 L334 188 L256 232 L178 188 L178 106 Z"
          fill="none" stroke="#FF6A00" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M256 90 L214 200 L240 200 L266 118 Z" fill="url(#badgeLegL)"/>
    <path d="M256 90 L298 200 L272 200 L246 118 Z" fill="url(#badgeLegR)"/>
    <path d="M206 166 L284 142 L284 168 L234 190 Z" fill="url(#badgeFold)"/>
    <path d="M206 166 L284 168 L234 190 Z" fill="#001C6B" opacity="0.26"/>
    <g transform="rotate(-9 262 186)">
      <rect x="240" y="174" width="44" height="22" rx="11" fill="url(#badgeBar)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="256" y="322" text-anchor="middle"
        font-family="'Poppins','Inter','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="600" fill="#FF6A00">ALO Labs</text>
  <text x="256" y="378" text-anchor="middle"
        font-family="'Poppins','Inter','Segoe UI',system-ui,sans-serif" font-size="52" font-weight="700" letter-spacing="1.2" fill="url(#badgeWord)">AGENTOS</text>

  <!-- rule + dot -->
  <path d="M136 400 H246" stroke="#003ABC" stroke-width="2"/>
  <path d="M266 400 H376" stroke="#003ABC" stroke-width="2"/>
  <circle cx="256" cy="400" r="6" fill="#FF6A00"/>

  <text x="256" y="432" text-anchor="middle"
        font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="5.4" fill="#64748B">AI AGENT OPERATING SYSTEM</text>
</svg>
