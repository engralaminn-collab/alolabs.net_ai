<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="ALO Labs AgentOS mark">
  <title>ALO Labs AgentOS mark</title>
  <defs>
    <!-- Brand gradients — guideline: orange #FF6A00 → #FFB300, blue #003ABC → #0077FF -->
    <linearGradient id="aloLegL" x1="0.1" y1="0.1" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0077FF"/>
      <stop offset="1" stop-color="#0047A1"/>
    </linearGradient>
    <linearGradient id="aloLegR" x1="0.9" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#003ABC"/>
      <stop offset="1" stop-color="#001C6B"/>
    </linearGradient>
    <linearGradient id="aloFold" x1="0" y1="1" x2="1" y2="0.1">
      <stop offset="0" stop-color="#0053C8"/>
      <stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <linearGradient id="aloBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- Hexagon shell -->
  <path d="M120 22 L210 73 L210 167 L120 218 L30 167 L30 73 Z"
        fill="none" stroke="#FF6A00" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Folded-ribbon A -->
  <path d="M120 56 L70 184 L102 184 L132 88 Z" fill="url(#aloLegL)"/>
  <path d="M120 56 L170 184 L138 184 L108 88 Z" fill="url(#aloLegR)"/>
  <path d="M62 146 L152 118 L152 148 L94 174 Z" fill="url(#aloFold)"/>
  <path d="M62 146 L152 148 L94 174 Z" fill="#001C6B" opacity="0.28"/>

  <!-- Orange bar nestled in the counter -->
  <g transform="rotate(-9 128 168)">
    <rect x="102" y="155" width="52" height="26" rx="13" fill="url(#aloBar)"/>
  </g>
</svg>
