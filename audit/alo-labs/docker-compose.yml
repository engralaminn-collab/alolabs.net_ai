version: "3.8"

services:
  # 1. ALO Labs App (Core API & React Dashboard Command Center)
  alolabs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alolabs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://alo_admin:StrongPostgresPassword2026!@alolabs-postgres:5432/alo_agentos_prod
      - REDIS_URL=redis://alolabs-redis:6379/0
      - MINIO_ENDPOINT=alolabs-minio:9000
      - MINIO_ACCESS_KEY=alo_minio_admin_user
      - MINIO_SECRET_KEY=StrongMinioSecret2026!
      - QDRANT_URL=http://alolabs-qdrant:6333
      - NEO4J_URI=bolt://alolabs-neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=StrongNeo4jPassword2026!
      - SUPER_ADMIN_EMAIL=alamin.iubat.eee.969@gmail.com
      - SUPER_ADMIN_MODE=true
      - CLEARANCE_LEVEL=SUPER_ADMIN
    depends_on:
      alolabs-postgres:
        condition: service_healthy
      alolabs-redis:
        condition: service_healthy
      alolabs-minio:
        condition: service_healthy
      alolabs-qdrant:
        condition: service_healthy
    volumes:
      - alolabs-app-data:/app/storage
    networks:
      - alolabs-network
      - coolify-infrastructure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alolabs-app.rule=Host(`alolabs.net`) || Host(`103.239.252.41`)"
      - "traefik.http.routers.alolabs-app.entrypoints=websecure"
      - "traefik.http.routers.alolabs-app.tls=true"
      - "traefik.http.routers.alolabs-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.alolabs-app.loadbalancer.server.port=3000"

  # 2. PostgreSQL Relational Database (Strictly Private to the Stack)
  alolabs-postgres:
    image: postgres:16-alpine
    container_name: alolabs-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=alo_agentos_prod
      - POSTGRES_USER=alo_admin
      - POSTGRES_PASSWORD=StrongPostgresPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - alolabs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alo_admin -d alo_agentos_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alolabs-network

  # 3. Redis Memory Database (Cache & Queue broker)
  alolabs-redis:
    image: redis:7-alpine
    container_name: alolabs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - alolabs-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - alolabs-network

  # 4. MinIO Object Storage (Self-Hosted S3 Private Storage)
  alolabs-minio:
    image: minio/minio:RELEASE.2024-05-10T01-39-38Z
    container_name: alolabs-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=alo_minio_admin_user
      - MINIO_ROOT_PASSWORD=StrongMinioSecret2026!
    volumes:
      - alolabs-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - alolabs-network

  # 5. Qdrant Vector Database (For High-Performance Agent RAG Embeddings)
  alolabs-qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: alolabs-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - alolabs-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - alolabs-network

  # 6. Neo4j Graph Database (For Graph RAG Structures & Multi-Agent Knowledge Matrix)
  alolabs-neo4j:
    image: neo4j:5.20-community
    container_name: alolabs-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/StrongNeo4jPassword2026!
    volumes:
      - alolabs-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alolabs-network

volumes:
  alolabs-app-data:
    driver: local
  alolabs-postgres-data:
    driver: local
  alolabs-redis-data:
    driver: local
  alolabs-minio-data:
    driver: local
  alolabs-qdrant-data:
    driver: local
  alolabs-neo4j-data:
    driver: local

networks:
  alolabs-network:
    driver: bridge
  coolify-infrastructure:
    external: true
