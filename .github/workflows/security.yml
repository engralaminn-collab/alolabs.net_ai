name: Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'arena/**'
  pull_request:
    branches:
      - main
      - develop
      - 'arena/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_paid_services:
        description: 'Allow billed / external-service steps to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Default deny. Both jobs here are free (the advisory database and the
  # gitleaks binary are not billed), so nothing is currently gated on this flag;
  # it is wired through so a future paid step inherits the same policy and so
  # every workflow resolves the flag identically.
  # Rules: scripts/ci-paid-services.sh (unit-tested).
  SKIP_PAID_SERVICES: 'true'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.4'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=critical

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        # gitleaks-action is free for personal accounts and small organizations;
        # organizations above that threshold need a GITLEAKS_LICENSE secret.
        # See https://github.com/gitleaks/gitleaks-action
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
