name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Audit dependencies
        run: |
          echo "Running dependency security audit..."
          npm audit --audit-level=critical || true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets and keys
        run: |
          echo "Scanning codebase for exposed private keys or tokens..."
          # Check for private key headers, AWS tokens, high entropy credentials in committed source
          SECRETS_FOUND=0
          if grep -rnE --exclude-dir={.git,node_modules,.next,coverage} "BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AKIA[0-9A-Z]{16}" . ; then
            echo "::warning::Potential secrets detected in workspace files"
          fi
          echo "Secret scanning completed successfully."