name: Security Scan

on:
  push:
    branches:
      - main
      - develop
      - EPOSmain

  pull_request:
    branches:
      - main
      - develop
      - EPOSmain

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: |
          bun audit --json > audit.json || true

      - name: Validate audit output
        run: |
          test -s audit.json

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("audit.json", "utf8")
          );

          console.log("Dependency audit completed.");
          console.log(
            JSON.stringify(data, null, 2).slice(0, 12000)
          );
          NODE

      - name: Upload dependency audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json
          if-no-files-found: warn


  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"


  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  security-summary:
    name: Security Summary
    if: always()
    needs:
      - dependency-audit
      - codeql
      - gitleaks

    runs-on: ubuntu-24.04

    steps:

      - name: Security result
        run: |
          echo "============================================================"
          echo " SECURITY SCAN RESULTS"
          echo "============================================================"

          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "CodeQL:           ${{ needs.codeql.result }}"
          echo "Gitleaks:         ${{ needs.gitleaks.result }}"

          if [ "${{ needs.dependency-audit.result }}" = "failure" ] || \
             [ "${{ needs.codeql.result }}" = "failure" ] || \
             [ "${{ needs.gitleaks.result }}" = "failure" ]; then

            echo
            echo "Security workflow contains a failed security job."
            exit 1
          fi

          echo
          echo "All security jobs completed successfully."
