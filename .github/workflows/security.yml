name: Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'arena/**'
  pull_request:
    branches:
      - main
      - develop
      - 'arena/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Audit dependencies
        run: |
          echo "Running dependency security audit..."
          npm audit --audit-level=critical || true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan codebase for secrets
        run: |
          echo "Scanning codebase for exposed private keys or credentials..."
          if grep -rnE --exclude-dir={.git,node_modules,.next,coverage} "BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|AKIA[0-9A-Z]{16}" . ; then
            echo "::warning::Potential credentials detected in repository files"
          fi
          echo "Secret scanning completed successfully."
