name: CI

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop, 'arena/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Repository CI baseline; production reports its independently installed version.
  BUN_VERSION: '1.2.5'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'

jobs:
  quality:
    name: TypeScript, tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Record tool versions
        run: |
          bun --version
          node --version
          bunx prisma --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate test Prisma client
        run: bun run db:generate
      - name: TypeScript hard gate
        run: ./node_modules/.bin/tsc --noEmit
      - name: Complete test suite
        run: bun run test
        env:
          NODE_ENV: test
      - name: ESLint
        run: bun run lint
      - name: Production build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Verify standalone artifacts
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
      - name: Verify database command safety
        run: bash deploy/scripts/database-safety-scan.sh .
