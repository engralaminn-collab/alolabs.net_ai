name: CI

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop, 'arena/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. CI only reads the checkout; it never writes to the repo, so
# the default GITHUB_TOKEN is narrowed to contents:read. Without this the token
# inherits the repository default, which may be write.
# Ref: https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

env:
  # Repository CI baseline; production reports its independently installed version.
  BUN_VERSION: '1.3.4'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'

jobs:
  quality:
    name: TypeScript, tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Record tool versions
        run: |
          bun --version
          node --version
          bunx prisma --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Production dependency advisory gate
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generate test Prisma client
        run: bun run db:generate
      - name: Prisma delegate/schema reconciliation
        run: bun run check:prisma-delegates
      - name: TypeScript hard gate
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --pretty false 2>&1 | tee /tmp/typescript-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## TypeScript diagnostics'
              echo '```text'
              cat /tmp/typescript-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/typescript-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete TypeScript diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Complete test suite
        run: bun run test
        env:
          NODE_ENV: test
      - name: ESLint
        run: bun run lint
      - name: Production build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Verify standalone artifacts
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
      - name: Verify database command safety
        run: bash deploy/scripts/database-safety-scan.sh .
      - name: Validate compose and deploy configuration
        # Dependency-free cross-file check: catches phantom services, broken
        # depends_on targets, app-port drift, and unreachable Caddy upstreams.
        # Runs without Docker so it works on every runner.
        run: node scripts/validate-compose.mjs
      - name: Validate API route auth coverage
        # Dependency-free. src/proxy.ts is the Next 16 edge gate and is
        # fail-closed, but it only checks that a Bearer token is PRESENT — the
        # authoritative session/tenant check is per-route via requireAuth().
        # A route that is neither allowlisted nor auth-checked is reachable with
        # `Authorization: Bearer x`, and fails silently. This makes it a build
        # failure instead. Also reports routes made public incidentally by a
        # startsWith() prefix match on a broader allowlist entry.
        run: node scripts/validate-route-auth.mjs
      - name: Validate GitHub Actions workflow security
        # Dependency-free. Guards the three workflow defects found by hand:
        # mutable action tags (re-pointable by upstream, in jobs holding the
        # production SSH key), a missing least-privilege `permissions:` block,
        # and secret names that drift between docs/CI-CD-GUIDE.md and the
        # workflows (DEPLOY_* vs PRODUCTION_* made the documented setup unable
        # to deploy). Also rejects interpolating secrets straight into `run:`.
        run: node scripts/validate-workflow-security.mjs
