name: CI

on:
  push:
    branches:
      - main
      - develop
      - EPOSmain

  pull_request:
    branches:
      - main
      - develop
      - EPOSmain

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          elif [[ -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            echo "::error::No Bun lockfile found."
            exit 1
          fi

      - name: Run ESLint
        run: bun run lint


  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          elif [[ -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            echo "::error::No Bun lockfile found."
            exit 1
          fi

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run TypeScript compiler
        run: bunx tsc --noEmit


  test:
    name: Tests (Vitest + Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          elif [[ -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            echo "::error::No Bun lockfile found."
            exit 1
          fi

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 7


  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          elif [[ -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            echo "::error::No Bun lockfile found."
            exit 1
          fi

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: Build Next.js application
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"
          NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-production"
          CSRF_SECRET: "ci-test-csrf-secret-do-not-use-in-production"

      - name: Verify Next.js build output
        shell: bash
        run: |
          set -euo pipefail

          test -d .next

          echo "=========================================="
          echo "NEXT.JS BUILD VERIFICATION"
          echo "=========================================="

          du -sh .next

          if [[ -d .next/standalone ]]; then
            echo "Standalone build: PRESENT"
          else
            echo "Standalone build: not enabled"
          fi

          if [[ -d .next/static ]]; then
            echo "Static assets: PRESENT"
          fi

          echo "Build verification: PASS"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
          if-no-files-found: error
          retention-days: 3
