name: Automated Backup

on:
  schedule:
    # Daily at 2:00 AM Asia/Dhaka (UTC+6) = 20:00 UTC previous day
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days to keep backups (default: 30)'
        required: false
        default: '30'

jobs:
  backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup on server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/alolabs/agent-hub"
            BACKUP_DIR="${APP_DIR}/backups"
            RETENTION_DAYS="${{ inputs.retention_days || '30' }}"
            BACKUP_ID=$(date '+%Y%m%d_%H%M%S')
            BACKUP_PATH="${BACKUP_DIR}/${BACKUP_ID}"
            mkdir -p "${BACKUP_PATH}"

            echo "==> Creating backup: ${BACKUP_ID}"

            # Load .env for database credentials
            source "${APP_DIR}/.env" 2>/dev/null || true

            # Parse DATABASE_URL
            DB_USER=$(echo "${DATABASE_URL:-}" | sed -n 's|mysql://\([^:]*\):\([^@]*\)@\([^:]*\):\([0-9]*\)/\(.*\)|\1|p')
            DB_PASS=$(echo "${DATABASE_URL:-}" | sed -n 's|mysql://\([^:]*\):\([^@]*\)@\([^:]*\):\([0-9]*\)/\(.*\)|\2|p')
            DB_HOST=$(echo "${DATABASE_URL:-}" | sed -n 's|mysql://\([^:]*\):\([^@]*\)@\([^:]*\):\([0-9]*\)/\(.*\)|\3|p')
            DB_PORT=$(echo "${DATABASE_URL:-}" | sed -n 's|mysql://\([^:]*\):\([^@]*\)@\([^:]*\):\([0-9]*\)/\(.*\)|\4|p')
            DB_NAME=$(echo "${DATABASE_URL:-}" | sed -n 's|mysql://\([^:]*\):\([^@]*\)@\([^:]*\):\([0-9]*\)/\(.*\)|\5|p')

            DB_USER="${DB_USER:-alohub_user}"
            DB_HOST="${DB_HOST:-127.0.0.1}"
            DB_PORT="${DB_PORT:-3306}"
            DB_NAME="${DB_NAME:-alohub_production}"

            # Create database dump
            DUMP_FILE="${BACKUP_PATH}/database.sql.gz"
            if command -v mysqldump &>/dev/null; then
              mysqldump \
                --single-transaction \
                --routines \
                --triggers \
                --set-gtid-purged=OFF \
                --column-statistics=0 \
                -h "${DB_HOST}" -P "${DB_PORT}" \
                -u "${DB_USER}" -p"${DB_PASS}" \
                "${DB_NAME}" 2>/dev/null | gzip > "${DUMP_FILE}"

              # Optional encryption
              if [[ -n "${BACKUP_ENCRYPTION_KEY:-}" ]]; then
                ENCRYPTED="${DUMP_FILE}.enc"
                echo "${BACKUP_ENCRYPTION_KEY}" | openssl enc -aes-256-cbc -salt -pbkdf2 \
                  -in "${DUMP_FILE}" -out "${ENCRYPTED}" -pass stdin 2>/dev/null
                rm -f "${DUMP_FILE}"
                mv "${ENCRYPTED}" "${DUMP_FILE}"
              fi

              DUMP_SIZE=$(du -h "${DUMP_FILE}" | cut -f1)
              echo "Database backup: ${DUMP_SIZE}"
            else
              echo "WARNING: mysqldump not found, skipping database backup"
            fi

            # Backup .env
            if [[ -f "${APP_DIR}/.env" ]]; then
              cp "${APP_DIR}/.env" "${BACKUP_PATH}/.env.bak"
              chmod 600 "${BACKUP_PATH}/.env.bak"
            fi

            # Record git info
            cd "${APP_DIR}"
            git rev-parse HEAD > "${BACKUP_PATH}/commit.txt" 2>/dev/null || true
            git branch --show-current > "${BACKUP_PATH}/branch.txt" 2>/dev/null || true
            date -Iseconds > "${BACKUP_PATH}/timestamp.txt"

            # Cleanup old backups
            DELETED=0
            while IFS= read -r old_backup; do
              if rm -rf "${old_backup}"; then
                DELETED=$(( DELETED + 1 ))
              fi
            done < <(find "${BACKUP_DIR}" -maxdepth 1 -mindepth 1 -type d -mtime "+${RETENTION_DAYS}" 2>/dev/null)
            echo "Removed ${DELETED} old backup(s) (older than ${RETENTION_DAYS} days)"

            BACKUP_SIZE=$(du -sh "${BACKUP_PATH}" | cut -f1)
            echo "Backup complete: ${BACKUP_ID} (${BACKUP_SIZE})"

      - name: Download backup from server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "backups/"
          target: "/tmp/alolabs-backup"
          strip_components: 0
          direction: download

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: /tmp/alolabs-backup/
          retention-days: 30