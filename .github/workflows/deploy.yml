name: Production database-safe deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_approved:
        description: 'Explicitly authorize reviewed, non-destructive production migrations'
        required: true
        default: false
        type: boolean
      run_paid_services:
        description: 'Allow the SSH deploy to the production host to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.4'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'
  # Default deny: the production deploy is a billed, externally-visible action,
  # so it needs an explicit opt-in rather than firing on every push to main.
  # See scripts/ci-paid-services.sh for the resolution rules.
  SKIP_PAID_SERVICES: 'true'

jobs:
  quality-and-safety:
    name: CI quality and production safety hard-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      skip_paid: ${{ steps.paid.outputs.skip_paid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve paid-services policy
        id: paid
        env:
          CI_RUN_PAID_OVERRIDE: ${{ inputs.run_paid_services == true && 'true' || '' }}
          SKIP_PAID_FROM_VARS: ${{ vars.SKIP_PAID_SERVICES }}
          SKIP_PAID_FROM_SECRET: ${{ secrets.SKIP_PAID_SERVICES }}
        run: |
          set -euo pipefail
          effective="${SKIP_PAID_FROM_VARS:-${SKIP_PAID_FROM_SECRET:-${SKIP_PAID_SERVICES:-true}}}"
          skip="$(CI_RUN_PAID_OVERRIDE="${CI_RUN_PAID_OVERRIDE}" SKIP_PAID_SERVICES="${effective}" \
            bash scripts/ci-paid-services.sh)"
          echo "skip_paid=${skip}" >> "${GITHUB_OUTPUT}"
          echo "SKIP_PAID_SERVICES=${skip}" >> "${GITHUB_ENV}"
          {
            echo '### Production deploy policy'
            echo ''
            echo "- \`SKIP_PAID_SERVICES\` = \`${skip}\`"
            if [[ "${skip}" == 'true' ]]; then
              echo '- The `deploy` job will be **skipped**. Quality gates still run.'
              echo '- To deploy: set the repository Variable `SKIP_PAID_SERVICES=false`, or'
              echo '  re-run via **Run workflow** with `run_paid_services` enabled.'
            else
              echo '- The `deploy` job is **enabled** and will SSH to the production host.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate workflow files
        run: bun run lint:workflows
      - name: Production dependency advisory gate (blocks deployment)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generate CI Prisma client
        run: bun run db:generate
      - name: Prisma delegate/schema reconciliation
        run: bun run check:prisma-delegates
      - name: TypeScript hard gate
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --pretty false 2>&1 | tee /tmp/typescript-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## TypeScript diagnostics'
              echo '```text'
              cat /tmp/typescript-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/typescript-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete TypeScript diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Complete test suite
        run: bun run test
        env:
          NODE_ENV: test
          SKIP_PAID_SERVICES: ${{ steps.paid.outputs.skip_paid }}
      - name: ESLint
        run: bun run lint
      - name: Build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Validate artifacts and deployment safety
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
          bash deploy/scripts/database-safety-scan.sh .
          bash -n deploy/scripts/database-safety-scan.sh
          bash -n deploy/scripts/backup.sh
          bash -n deploy/scripts/deploy.sh
      - name: Stage reviewed safety scripts
        run: |
          mkdir -p production-safety-scripts
          install -m 700 deploy/scripts/deploy.sh production-safety-scripts/deploy.sh
          install -m 700 deploy/scripts/backup.sh production-safety-scripts/backup.sh
          install -m 700 deploy/scripts/database-safety-scan.sh production-safety-scripts/database-safety-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-safety-scripts
          path: production-safety-scripts
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: quality-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # Default deny, decided by the unit-tested scripts/ci-paid-services.sh via
    # the gate job above — the expression is not duplicated here, so the shell
    # and the workflow cannot disagree about when production gets touched.
    if: needs.quality-and-safety.outputs.skip_paid == 'false'
    steps:
      - name: Validate required deployment secrets
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USERNAME: ${{ secrets.PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          test -n "${HOST}" || { echo 'PRODUCTION_HOST is missing'; exit 1; }
          test -n "${USERNAME}" || { echo 'PRODUCTION_USER is missing'; exit 1; }
          test -n "${SSH_KEY}" || { echo 'PRODUCTION_SSH_KEY is missing'; exit 1; }
          test -n "${SSH_PORT}" || { echo 'PRODUCTION_PORT is missing'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-safety-scripts
          path: production-safety-scripts
      - name: Transfer reviewed safety scripts without changing production
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          source: production-safety-scripts/*
          target: /tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: true
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          MIGRATIONS_APPROVED: ${{ inputs.migrations_approved || 'false' }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          command_timeout: 30m
          envs: MIGRATIONS_APPROVED
          script: |
            set -euo pipefail
            TEMP_DIR=/tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
            trap 'rm -rf "${TEMP_DIR}"' EXIT
            chmod 700 "${TEMP_DIR}"/*.sh
            sudo APP_DIR=/opt BRANCH=main SAFETY_SCRIPT_DIR="${TEMP_DIR}" \
              MIGRATIONS_APPROVED="${MIGRATIONS_APPROVED}" bash "${TEMP_DIR}/deploy.sh"
