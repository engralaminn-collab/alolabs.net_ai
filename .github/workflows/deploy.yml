name: Production database-safe deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Required. Set to true to actually deploy to production.'
        required: true
        default: false
        type: boolean
      migrations_approved:
        description: 'Explicitly authorize reviewed, non-destructive production migrations'
        required: true
        default: false
        type: boolean
      run_paid_services:
        description: 'Allow the SSH deploy to the production host to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.4'
  DATABASE_URL: 'file:./ci.db'
  NEXTAUTH_SECRET: 'ci-only-not-production'
  CSRF_SECRET: 'ci-only-not-production'
  JWT_SECRET: 'ci-only-not-production'
  API_GATEWAY_SECRET: 'ci-only-not-production'
  # Default deny: the production deploy is a billed, externally-visible action,
  # so it needs an explicit opt-in rather than firing on every push to main.
  # See scripts/ci-paid-services.sh for the resolution rules.
  SKIP_PAID_SERVICES: 'true'

jobs:
  quality-and-safety:
    name: CI quality and production safety hard-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      skip_paid: ${{ steps.paid.outputs.skip_paid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate workflow files
        run: bun run lint:workflows
      - name: Production dependency advisory gate (blocks deployment)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generate CI Prisma client
        run: bun run db:generate
      - name: Prisma delegate/schema reconciliation
        run: bun run check:prisma-delegates
      - name: TypeScript hard gate
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit --pretty false 2>&1 | tee /tmp/typescript-errors.txt
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            {
              echo '## TypeScript diagnostics'
              echo '```text'
              cat /tmp/typescript-errors.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            diagnostic="$(cat /tmp/typescript-errors.txt)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Complete TypeScript diagnostics::${diagnostic}"
            exit "${status}"
          fi
      - name: Complete test suite
        run: bun run test
        env:
          NODE_ENV: test
          SKIP_PAID_SERVICES: ${{ steps.paid.outputs.skip_paid }}
      - name: ESLint
        run: bun run lint
      - name: Build verification
        run: bun run build
        env:
          NODE_ENV: production
          PORT: '3011'
      - name: Validate artifacts and deployment safety
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          test -d .next/standalone/.next/static
          test -d public
          test -d .next/standalone/public
          bash deploy/scripts/database-safety-scan.sh .
          bash -n deploy/scripts/database-safety-scan.sh
          bash -n deploy/scripts/backup.sh
          bash -n deploy/scripts/deploy.sh
          bash -n deploy/scripts/setup-deploy-target.sh
      - name: Run the repository configuration guards
        # These three are the same dependency-free gates CI runs. The deploy
        # path previously ran none of them, so the gate protecting production
        # was WEAKER than the gate protecting a pull request: a compose/port
        # drift, an unauthenticated API route, or an unpinned third-party
        # action could reach production without ever failing a check here.
        run: |
          node scripts/validate-compose.mjs
          node scripts/validate-route-auth.mjs
          node scripts/validate-workflow-security.mjs
      - name: Stage reviewed safety scripts
        run: |
          mkdir -p production-safety-scripts
          install -m 700 deploy/scripts/deploy.sh production-safety-scripts/deploy.sh
          install -m 700 deploy/scripts/backup.sh production-safety-scripts/backup.sh
          install -m 700 deploy/scripts/database-safety-scan.sh production-safety-scripts/database-safety-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-safety-scripts
          path: production-safety-scripts
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: quality-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # EXPLICIT APPROVAL GATE.
    #
    # Previously this job ran on every push to main. The `production`
    # environment has protection_rules: [] and deployment_branch_policy: null
    # (verified via the REST API), so nothing stood between a merge and a
    # production deploy — the moment Actions billing is fixed and the four
    # PRODUCTION_* secrets exist, any push to main would deploy unattended.
    #
    # The GitHub-native control for this is a required reviewer on the
    # environment, but per
    # https://docs.github.com/en/rest/deployments/environments
    # "If you are on a GitHub Free, GitHub Pro, or GitHub Team plan, other
    # deployment protection rules, such as a wait timer or required reviewers,
    # are only available for public repositories." This repository is PRIVATE,
    # so that control may not be available on your plan.
    #
    # This condition is therefore plan-independent: a push to main still runs
    # every quality and safety gate above, but the deploy itself only happens
    # on a manual dispatch with confirm_production_deploy=true.
    #
    # TO RESTORE AUTO-DEPLOY (only if your plan supports required reviewers):
    # add the reviewer rule per docs/DEPLOYMENT-RUNBOOK.md step 2, confirm it
    # pauses the job, then delete the `if:` line below.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true
    steps:
      - name: Validate required deployment secrets
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USERNAME: ${{ secrets.PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          test -n "${HOST}" || { echo 'PRODUCTION_HOST is missing'; exit 1; }
          test -n "${USERNAME}" || { echo 'PRODUCTION_USER is missing'; exit 1; }
          test -n "${SSH_KEY}" || { echo 'PRODUCTION_SSH_KEY is missing'; exit 1; }
          test -n "${SSH_PORT}" || { echo 'PRODUCTION_PORT is missing'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-safety-scripts
          path: production-safety-scripts
      - name: Create a private staging directory (refuse any pre-existing path)
        # /tmp is world-writable. The scp below writes into
        # /tmp/alo-deploy-<run_id>-<run_attempt>, and that directory is later
        # executed with `sudo`. If another local user pre-created that path —
        # in particular as a symlink to somewhere like /etc — the scp would
        # follow it and the subsequent `chmod 700 .../*.sh` + `sudo bash` would
        # operate on attacker-influenced files. So create it first, as the
        # deploy user, mode 0700, and FAIL if anything is already there.
        # `mkdir` without -p refuses an existing path; the -L test additionally
        # catches a dangling symlink, which -e misses.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            set -eu
            D="/tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -e "$D" ] || [ -L "$D" ]; then
              echo "REFUSING: staging path already exists: $D" >&2
              ls -ld "$D" >&2 || true
              exit 1
            fi
            mkdir -m 700 "$D"
            ls -ld "$D"
      - name: Transfer reviewed safety scripts without changing production
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          source: production-safety-scripts/*
          target: /tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: true
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          MIGRATIONS_APPROVED: ${{ inputs.migrations_approved || 'false' }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          command_timeout: 30m
          envs: MIGRATIONS_APPROVED
          script: |
            set -euo pipefail
            TEMP_DIR=/tmp/alo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
            trap 'rm -rf "${TEMP_DIR}"' EXIT
            chmod 700 "${TEMP_DIR}"/*.sh
            sudo APP_DIR=/opt BRANCH=main SAFETY_SCRIPT_DIR="${TEMP_DIR}" \
              MIGRATIONS_APPROVED="${MIGRATIONS_APPROVED}" bash "${TEMP_DIR}/deploy.sh"
