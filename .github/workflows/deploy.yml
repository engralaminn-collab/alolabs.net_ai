name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/backup.yml'
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip post-deploy health check'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rollback_on_failure:
        description: 'Auto-rollback on health check failure'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/alolabs/agent-hub"
            SERVICE_NAME="alolabs-agent-hub"
            HEALTH_TIMEOUT=90
            MAX_RETRIES=3

            echo "==> [1/4] Pulling latest code..."
            cd "${APP_DIR}"
            CURRENT_COMMIT=$(git rev-parse HEAD)
            git fetch origin main
            NEW_COMMIT=$(git rev-parse origin/main)

            if [[ "${CURRENT_COMMIT}" == "${NEW_COMMIT}" ]]; then
              echo "Already up to date. No changes to deploy."
              exit 0
            fi

            echo "Deploying: ${CURRENT_COMMIT:0:8} → ${NEW_COMMIT:0:8}"

            # Save previous commit for rollback
            echo "${CURRENT_COMMIT}" > "${APP_DIR}/.deploy-previous-commit"

            git reset --hard origin/main

            echo "==> [2/4] Installing dependencies..."
            bun install --frozen-lockfile || bun install

            echo "==> [3/4] Database migration..."
            bun run db:push --accept-data-loss 2>&1 || bun run db:generate

            echo "==> [3.5/4] Building application..."
            NODE_ENV=production bun run build

            echo "==> [4/4] Restarting service..."
            systemctl daemon-reload

            RETRY=0
            while [[ ${RETRY} -lt ${MAX_RETRIES} ]]; do
              systemctl restart "${SERVICE_NAME}"
              echo "Waiting for health check (timeout: ${HEALTH_TIMEOUT}s)..."

              HEALTH_START=$(date +%s)
              HEALTHY=false

              while [[ $(( $(date +%s) - HEALTH_START )) -lt ${HEALTH_TIMEOUT} ]]; do
                if systemctl is-active --quiet "${SERVICE_NAME}" 2>/dev/null; then
                  if curl -sf -o /dev/null -w '%{http_code}' "http://127.0.0.1:3004/api/health" 2>/dev/null | grep -q '200'; then
                    HEALTHY=true
                    break
                  fi
                fi
                sleep 3
              done

              if [[ "${HEALTHY}" == "true" ]]; then
                echo "✅ Service is healthy"
                break
              fi

              RETRY=$(( RETRY + 1 ))
              echo "Health check failed (attempt ${RETRY}/${MAX_RETRIES})"

              if [[ ${RETRY} -ge ${MAX_RETRIES} ]]; then
                echo "❌ Health check failed after ${MAX_RETRIES} attempts"
                if [[ "${{ inputs.rollback_on_failure || 'true' }}" == "true" ]]; then
                  echo "==> Rolling back to ${CURRENT_COMMIT:0:8}..."
                  git reset --hard "${CURRENT_COMMIT}"
                  bun install --frozen-lockfile || bun install
                  bun run db:generate
                  NODE_ENV=production bun run build
                  systemctl restart "${SERVICE_NAME}"
                  sleep 10
                  echo "Rollback complete. Check: journalctl -u ${SERVICE_NAME} -n 50"
                fi
                exit 1
              fi
              sleep 5
            done

            echo "==> Deployment successful"
            echo "${NEW_COMMIT:0:8} deployed at $(date -Iseconds)" >> "${APP_DIR}/logs/deployments.log"

      - name: Post-deploy health check
        if: inputs.skip_health_check != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            bash /opt/alolabs/agent-hub/deploy/scripts/healthcheck.sh --json
            echo "Exit code: $?"