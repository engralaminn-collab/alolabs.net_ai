name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  BUN_VERSION: "1.2.5"

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run bun audit
        run: bun audit 2>&1 | tee audit-results.txt || true

      - name: Check for known vulnerabilities
        run: |
          echo "=== Checking for high/critical vulnerabilities ==="
          HIGH_CRIT=$(rg -c '"(high|critical)"' audit-results.txt 2>/dev/null || echo "0")
          if [[ "${HIGH_CRIT}" -gt "0" ]]; then
            echo "Found ${HIGH_CRIT} high/critical vulnerabilities"
            bun pm ls 2>/dev/null | head -50
          else
            echo "No high/critical vulnerabilities found"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.txt
          retention-days: 30

      - name: Generate SARIF report
        run: |
          # Convert audit output to SARIF format
          cat > audit.sarif <<'SARIF_EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "bun-audit",
                    "version": "${BUN_VERSION}",
                    "informationUri": "https://bun.sh/docs/cli/audit"
                  }
                },
                "results": []
              }
            ]
          }
          SARIF_EOF

          # Parse audit results and populate SARIF if vulnerabilities found
          if [[ -s audit-results.txt ]]; then
            python3 <<'PYEOF'
          import json, re, sys

          try:
              with open("audit-results.txt") as f:
                  content = f.read()

              with open("audit.sarif") as f:
                  sarif = json.load(f)

              results = []
              # Try to extract vulnerability info from bun audit output
              for line in content.splitlines():
                  if "vulnerability" in line.lower() or "critical" in line.lower() or "high" in line.lower():
                      results.append({
                          "ruleId": "audit-finding",
                          "level": "error" if "critical" in line.lower() else "warning",
                          "message": {"text": line.strip()},
                          "locations": [{
                              "physicalLocation": {
                                  "artifactLocation": {"uri": "package.json"}
                              }
                          }]
                      })

              sarif["runs"][0]["results"] = results

              with open("audit.sarif", "w") as f:
                  json.dump(sarif, f, indent=2)
          except Exception as e:
              print(f"Error parsing audit results: {e}", file=sys.stderr)
          PYEOF
          fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit.sarif
          category: bun-audit