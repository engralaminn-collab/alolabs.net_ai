name: Security Scan (Weekly Deep Audit)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_paid_services:
        description: 'Allow billed / external-service steps to run (default: skipped)'
        required: false
        default: false
        type: boolean

concurrency:
  group: security-deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

env:
  BUN_VERSION: '1.3.4'
  # Default deny; the advisory database is free so nothing is gated today.
  # Wired through so the flag resolves identically across every workflow.
  # Rules: scripts/ci-paid-services.sh (unit-tested).
  SKIP_PAID_SERVICES: 'true'

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun audit --audit-level=critical 2>&1 | tee audit-results.txt

      - name: Publish audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: audit-results.txt
          if-no-files-found: ignore
          retention-days: 14
