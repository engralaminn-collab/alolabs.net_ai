name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_paid_services:
        description: 'Also build linux/arm64 via QEMU emulation (slow, billable; default: amd64 only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Default deny: the arm64 leg is emulated with QEMU on an amd64 runner, which
  # is several times slower than a native build and therefore the single largest
  # Actions-minutes consumer in this repository. It needs an explicit opt-in.
  # Resolution rules live in scripts/ci-paid-services.sh (unit-tested).
  SKIP_PAID_SERVICES: 'true'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve paid-services policy
        # amd64 always builds; arm64 (emulated, expensive) only on opt-in.
        id: paid
        env:
          CI_RUN_PAID_OVERRIDE: ${{ inputs.run_paid_services == true && 'true' || '' }}
          SKIP_PAID_FROM_VARS: ${{ vars.SKIP_PAID_SERVICES }}
          SKIP_PAID_FROM_SECRET: ${{ secrets.SKIP_PAID_SERVICES }}
        run: |
          set -euo pipefail
          effective="${SKIP_PAID_FROM_VARS:-${SKIP_PAID_FROM_SECRET:-${SKIP_PAID_SERVICES:-true}}}"
          skip="$(CI_RUN_PAID_OVERRIDE="${CI_RUN_PAID_OVERRIDE}" SKIP_PAID_SERVICES="${effective}" \
            bash scripts/ci-paid-services.sh)"
          if [[ "${skip}" == 'false' ]]; then
            platforms='linux/amd64,linux/arm64'
          else
            platforms='linux/amd64'
          fi
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Image platforms'
            echo ''
            echo "- \`SKIP_PAID_SERVICES\` = \`${skip}\`"
            echo "- Building: \`${platforms}\`"
            if [[ "${skip}" == 'true' ]]; then
              echo ''
              echo 'The emulated `linux/arm64` leg is skipped. Enable it with the'
              echo 'repository Variable `SKIP_PAID_SERVICES=false`, or run this'
              echo 'workflow manually with `run_paid_services` enabled.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up QEMU (emulated arm64 only)
        if: steps.paid.outputs.platforms == 'linux/amd64,linux/arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push (${{ steps.paid.outputs.platforms }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.paid.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
