# ============================================================
# ALO Labs AIOS — Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Extends docker-compose.yml with production settings
# ============================================================

services:
  # ── Main Application (production build) ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alolabs-app
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:/app/data/agenthub.db"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET:-agent-hub}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: "${S3_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${S3_SECRET_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      APP_SECRET: "${APP_SECRET}"
      CSRF_SECRET: "${CSRF_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - ./data:/app/data
      - app_logs:/app/logs
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/data
        bunx prisma db push --skip-generate 2>/dev/null || true
        exec bun server.js
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - alolabs-net

  # ── Redis (production overrides) ──────────────────────────
  redis:
    restart: always
    ports: []
    command: >
      redis-server
      --bind 0.0.0.0
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Qdrant (production overrides) ─────────────────────────
  qdrant:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── MinIO (production overrides) ──────────────────────────
  minio:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  app_logs:
    driver: local
