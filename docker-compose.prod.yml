# ============================================================
# ALO Labs AgentOS — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file only *overrides* services that docker-compose.yml already defines.
# Every service named here must exist in the base file — compose aborts on a
# `depends_on` or override block for an undefined service. That invariant is
# checked in CI by scripts/validate-compose.mjs.
#
# PORT CONTRACT: the app listens on 3011. See docker-compose.yml.
# ============================================================

services:
  # ── Main Application (production hardening) ───────────────────
  app:
    restart: always
    # Base binds to 127.0.0.1 (Caddy is the only public entrypoint). Production
    # keeps that posture; expose APP_PORT on the host loopback for local probes.
    ports:
      - "127.0.0.1:${APP_PORT:-3011}:3011"
    environment:
      NODE_ENV: production
      PORT: "3011"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:/app/data/agenthub.db"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      APP_SECRET: "${APP_SECRET}"
      CSRF_SECRET: "${CSRF_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
      API_GATEWAY_SECRET: "${API_GATEWAY_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    # No custom entrypoint: the image's CMD ["node","server.js"] is correct.
    #
    # The previous override ran `bunx prisma db push && exec bun server.js`.
    # That could never work — the image is node:20-slim with no bun installed,
    # and `prisma` is a devDependency that is not present in the runner stage.
    #
    # Schema initialisation is a deliberate, separate operator step instead:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #     run --rm --entrypoint npx app prisma db push --schema=prisma/schema.prisma
    # (or run scripts/sqlite-push.ts against the mounted ./data volume).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - alolabs-net

  # ── Redis (production overrides) ──────────────────────────
  redis:
    restart: always
    # Not published in production: only the app may reach it, over alolabs-net.
    ports: []
    command: >
      redis-server
      --bind 0.0.0.0
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Qdrant (production overrides) ─────────────────────────
  qdrant:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── MinIO (production overrides) ──────────────────────────
  minio:
    restart: always
    ports: []
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set for production}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?S3_SECRET_KEY must be set for production}"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Caddy (production overrides) ──────────────────────────
  caddy:
    restart: always
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN must be set for production TLS}"
      APP_UPSTREAM: app:3011

  # ── Prometheus / Grafana (production overrides) ───────────
  prometheus:
    restart: always

  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://${DOMAIN}/grafana}"
