# ============================================================
# ALO Labs Agent Hub — Nginx Reverse Proxy Configuration
# Domains: alolabs.net | panel.alolabs.net | api.alolabs.net
# ============================================================

# ── Proxy cache ─────────────────────────────────────────────
proxy_cache_path /var/cache/nginx/alolabs levels=1:2 keys_zone=alolabs_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ── Rate-limiting zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=panel_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Upstream ─────────────────────────────────────────────────
upstream alolabs_backend {
    server 127.0.0.1:3011;
    keepalive 64;
}

# ── HTTP → HTTPS redirect (all domains) ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name alolabs.net panel.alolabs.net api.alolabs.net www.alolabs.net;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Block all other HTTP traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: alolabs.net (Main / Landing) ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alolabs.net www.alolabs.net;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/alolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alolabs.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/alolabs.net/chain.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # ── Security headers ─────────────────────────────────────
    include /etc/nginx/snippets/security-headers.conf;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/alolabs_main_access.log combined;
    error_log  /var/log/nginx/alolabs_main_error.log warn;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Proxy to Next.js ─────────────────────────────────────
    location / {
        limit_req zone=panel_limit burst=20 nodelay;
        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── Static assets with aggressive caching ────────────────
    location /_next/static/ {
        proxy_pass http://alolabs_backend;
        proxy_cache alolabs_cache;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Favicon / icons ──────────────────────────────────────
    location /favicon.ico {
        proxy_pass http://alolabs_backend;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location /icons/ {
        proxy_pass http://alolabs_backend;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }
}

# ── HTTPS: panel.alolabs.net (Admin Panel) ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.alolabs.net;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/panel.alolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.alolabs.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/panel.alolabs.net/chain.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # ── Security headers ─────────────────────────────────────
    include /etc/nginx/snippets/security-headers.conf;
    # Panel should not be iframed by other origins
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/alolabs_panel_access.log combined;
    error_log  /var/log/nginx/alolabs_panel_error.log warn;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Auth endpoints — stricter rate limit ─────────────────
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API endpoints ────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        # Deny access to internal/debug endpoints from outside
        location ~* ^/api/(debug|internal|health|metrics) {
            # Allow only from localhost / private IPs
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://alolabs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Upload size (for file uploads)
        client_max_body_size 50m;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── WebSocket for queue service ──────────────────────────
    location /socket.io/ {
        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Proxy to Next.js ─────────────────────────────────────
    location / {
        limit_req zone=panel_limit burst=20 nodelay;
        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── Static assets ────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://alolabs_backend;
        proxy_cache alolabs_cache;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }
}

# ── HTTPS: api.alolabs.net (API Gateway) ───────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.alolabs.net;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.alolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alolabs.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.alolabs.net/chain.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    # ── Security headers (API — no framing needed) ───────────
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options "DENY" always;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/alolabs_api_access.log combined;
    error_log  /var/log/nginx/alolabs_api_error.log warn;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types application/json;
    gzip_min_length 256;
    gzip_vary on;

    # ── API — stricter limits ────────────────────────────────
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        client_max_body_size 50m;

        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Health endpoint (for load balancers / monitoring) ────
    location /api/health {
        access_log off;
        proxy_pass http://alolabs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}