# ============================================================
# ALO Labs AgentOS — Nginx Production Configuration
# ============================================================
#
# This is the SINGLE-DOMAIN production config.
# Replace "your-domain.com" with your actual domain.
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/agentos
#   2. Edit: replace "your-domain.com" with your domain
#   3. sudo ln -s /etc/nginx/sites-available/agentos /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d your-domain.com
#
# ============================================================

# ── Proxy cache ─────────────────────────────────────────────
proxy_cache_path /var/cache/nginx/agentos levels=1:2 \
    keys_zone=agentos_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ── Rate-limiting zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Upstream (Next.js app on port 3000) ─────────────────────
upstream agentos_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL (Certbot will auto-configure these paths) ────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (Certbot sets this up)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/agentos_access.log combined;
    error_log  /var/log/nginx/agentos_error.log warn;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ── Client limits ────────────────────────────────────────
    client_max_body_size 50m;

    # ── Auth endpoints — strict rate limit ───────────────────
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API endpoints ────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Longer timeouts for API (LLM calls, etc.)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Internal/debug endpoints — localhost only ────────────
    location ~* ^/api/(debug|internal|metrics|system-health|health/deep) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── Health endpoint (for monitoring) ─────────────────────
    location = /api/health {
        access_log off;
        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket for Socket.IO ─────────────────────────────
    location /socket.io/ {
        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Next.js static assets — aggressive caching ──────────
    location /_next/static/ {
        proxy_pass http://agentos_backend;
        proxy_cache agentos_cache;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ── Favicon / icons / manifest ───────────────────────────
    location ~* ^/.*\.(ico|png|svg|webmanifest)$ {
        proxy_pass http://agentos_backend;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Sitemap / robots ─────────────────────────────────────
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://agentos_backend;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Everything else ──────────────────────────────────────
    location / {
        proxy_pass http://agentos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
